<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | SarkariPYQ</title>
    <meta name="robots" content="noindex" />
    <style>
      body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
      .box{text-align:center;max-width:480px}
      .logo{width:64px;height:64px;background:#2563eb;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;margin-bottom:16px}
      h1{color:#2563eb;margin:0 0 8px;font-size:28px}
      p{color:#475569;line-height:1.6;margin:0 0 16px}
      a{color:#2563eb;font-weight:600;text-decoration:none;border-bottom:2px solid #2563eb}
      .btn{display:inline-block;background:#2563eb;color:#fff;padding:12px 24px;border-radius:8px;font-weight:600;margin-top:8px;text-decoration:none}
    </style>
  </head>
  <body>
    <div class="box">
      <div class="logo">PYQ</div>
      <h1>You're offline</h1>
      <p>SarkariPYQ needs an internet connection to load new questions. Please reconnect to continue practicing SSC Previous Year Questions.</p>
      <a href="/" class="btn">Try Again</a>
    </div>
  </body>
</html>
